  function deliverySettings(){const c=PCSellerChoice.config(s);return s.product.fulfilment==='Warehouse'?field('Transport this batch to the warehouse (₹)','inbound',c.inbound)+field('Setup amount still to pay (₹)','setup',c.setup)+`<label class="check"><input type="checkbox" data-delivery="setupPaid" ${c.setupPaid?'checked':''}> Setup already paid</label>`:'';}
  function product(){const total=!s.costs.private&&Number.isFinite(s.costs.C)&&Number.isFinite(s.costs.o)?s.costs.C+s.costs.o:null;return intro('Let’s plan your first online sale.','Tell us your cost, starting quantity and budget.')+`<div class="product-layout"><section class="product-identity">${sketch}<h2>CAT5e Ethernet cable</h2><p>5 m · White · Pack of 1</p><div class="spec-tags"><span>RJ45 connectors</span><span>UTP cable</span><span>${s.product.packedWeight} g packed</span></div>${fold('Check product details',field('Chargeable packed weight (g)','packedWeight',s.product.packedWeight)+'<p>Use the shipping weight, including packaging.</p>')}</section><section class="field-stack">${field('Cost of one item, including packing (₹)','totalCost',total,'Includes '+money(s.costs.o)+' packing / preparation. Change this split in Optional details.').replace('data-field="totalCost"','data-field="totalCost"'+(s.costs.private?' disabled':''))}<label class="check"><input type="checkbox" data-private ${s.costs.private?'checked':''}> Keep my product cost private</label>${field('How many pieces will you start with?','cap',s.seller.cap)}${field('How much money can you set aside? (₹)','cash',s.seller.cash)}</section></div>`+
    fold('Optional details',`<div class="settings-grid">${field('Product cost without packing (₹)','C',s.costs.C)}${field('Packing / preparation per parcel (₹)','o',s.costs.o)}${field('Pieces you already have','owned',s.seller.owned)}${field('Minimum pieces your supplier sells','moq',s.seller.moq)}${field('Amount you want to keep per parcel (₹)','g',s.seller.g)}</div><p>Product and packing stay separate in the calculation because intact returned products can be sold again. Your target is averaged across all parcels sent. Zero checks break-even; positive earnings are still required.</p>`)+
    fold('Where will you send orders from?',`<label>Send orders from<select data-select="fulfilment"><option value="self" ${s.product.fulfilment!=='Warehouse'?'selected':''}>My location</option><option value="warehouse" ${s.product.fulfilment==='Warehouse'?'selected':''}>A warehouse</option></select></label><div class="settings-grid">${deliverySettings()}</div>`)+actions('Choose my selling price →','step-2');}
  function outcomes(q){return !q?.econ||!q.quoteOk?'':`<div class="outcomes">${[['kept',s.mix.k,q.econ.kept],['RTO',s.mix.r,q.econ.rto],['returned',s.mix.q,q.econ.ret]].map(([t,p,v])=>`<div><span>${+p.toFixed(2)}% ${t}</span><b>${money(v)}</b></div>`).join('')}</div><div class="average"><span>Across these outcomes</span><b>${money(q.econ.expected)} / dispatch</b></div>`;}
  function volume(e){const [a,b]=e.rows;if(!a.econ||!b.econ||!a.quoteOk||!b.quoteOk)return 'Refresh the costs and parcel quote before comparing earnings.';if(a.econ.expected<=0||b.econ.expected<=0)return 'Fix the costs or offer before buying stock at a loss-making price.';return `₹189 needs ${(b.econ.expected/a.econ.expected).toFixed(2)}× the completed volume to beat ₹210. Customer demand is still unknown.`;}
  function compare(e){const q=pick(e);return intro('Your rivals’ prices. Your choice.','Use comparable offers as a reference, then choose the price you want to test.')+`<div class="benchmark"><span>Cable price references</span><b>${e.cmp.n?money(e.cmp.min)+'–'+money(e.cmp.max):'No qualified offers'}</b>${btn('See rival offers ↗','offers')}</div><section class="seller-price"><div><label>Your buyer-facing price (₹)<input data-seller-price type="number" min="0.01" step="0.01" value="${chosen??''}" inputmode="decimal"></label><div class="reference-buttons"><span>Quick references</span>${s.quotes.map(x=>btn('Use '+money(x.buyer),'choose-'+x.buyer)).join('')}</div><p class="muted">You can choose within or outside the rival range.</p></div><div class="price-result" aria-live="polite"><span>Estimated bank transfer · kept order</span><b>${money(q?.transfer)}</b><small>Selling price less shipping, shipping GST and applicable deductions</small><div class="chosen-earnings"><span>${s.costs.private?'Maximum product cost at your target':'Average earnings per parcel'}</span><b class="${q?.econ?.expected<0?'negative':'green'}">${money(s.costs.private?q?.ceiling?.minimum:q?.econ?.expected)}</b></div></div></section>${e.outsideRange?`<p class="range-note">${money(chosen)} is ${chosen<e.cmp.min?'below':'above'} the rival range. You can still choose it; customer response needs testing.</p>`:''}<p class="definition">Contribution includes product, preparation and failed-order costs; before fixed costs and seller tax reconciliation.</p>${decisionHelp(e)}<p class="batch-summary">Money for this test: <b>${money(e.proc.known?e.proc.need:null)}</b></p>${!eligible(e)?alert(e.reasons.map(esc).join('<br>')||'Review your price and costs.'):''}`+fold('See payout and order-outcome breakdown',outcomes(q)+`<p>${volume(e)}</p>`+calculation(e))+actions(`Plan my test at ${money(chosen)} →`,'step-3',!eligible(e));}

  function decisionHelp(e){
    const g=PCSellerChoice.guidance(s,e,M);if(!g||s.mode==='real')return '';
    const candidate=g.candidate,matched=candidate!==null;
    return `<section class="decision-help"><h2>${matched?money(candidate)+' clears your cost check':'Review your costs before testing'}</h2><p>${matched?'Covers your planned batch costs. Start small; you choose the price.':'The comparison prices do not cover your modeled costs.'}</p><div class="guidance-actions">${matched&&candidate!==chosen?btn('Use '+money(candidate),'choose-'+candidate):''}${btn('See the maths','maths')}${g.alternative?btn('Compare shipping options','self-ship'):''}</div></section>`;
  }

  function decisionProof(e){const g=PCSellerChoice.guidance(s,e,M);if(!g)return '<h2>Price calculation</h2><p>Confirm costs and fees to see this calculation.</p>';return `<h2>Why this starting price?</h2><p>${g.candidate!==null?money(g.candidate)+' is the lowest included comparison example that clears your earnings target and the entered batch costs.':'None of the included comparison examples clears the economic checks.'} Comparison examples have not been newly verified as market offers.</p><p><b>${money(g.floor)}</b> economic threshold if all ${g.quantity} planned dispatches occur.</p><p>At your selected price of <b>${money(chosen)}</b>, the modeled batch result is <b>${money(g.periodResult)}</b>, after ${money(g.fixed)} batch costs. This result belongs to your selected price, which may differ from the suggested price.</p><p>Customer-return outcomes reduce the average by ${money(g.returnDrag)} per parcel; RTO outcomes by ${money(g.rtoDrag)}.</p><p>These are viability conditions, not predicted sales. Begin with controlled stock and review completed outcomes.</p>${g.alternative?`<p>At the same selected price, shipping from your location gives ${money(g.alternative.contribution)} per parcel under the current fee rules.</p>`:''}`;}

  function test(e){const p=e.proc,q=pick(e);return intro('How much can you commit?','Start with controlled stock while you learn demand and completed-order outcomes.')+`<div class="test-top"><div><span>Selected buyer price</span><b>${money(chosen)}</b><small>${q?.quoteOk?money(q?.econ?.expected):'Unknown'} contribution / dispatch</small></div><div><span>Initial stock limit</span><b>${p.known?p.units:'—'} <small>units</small></b><small>A stock limit does not predict sales.</small></div></div>${p.known?`<section class="funding"><div class="funding-head"><span>Money to keep ready</span><b>${money(p.need)} <small>of ${money(s.seller.cash)}</small></b></div><div class="cashbar"><span style="flex:${p.newUnits*s.costs.C}"></span><span style="flex:${p.units*s.costs.o}"></span><span style="flex:${p.reserveHeld}"></span></div><div class="cash-labels"><span>Product <b>${money(p.newUnits*s.costs.C)}</b></span><span>Packing + other <b>${money(p.units*e.effectiveState.costs.o)}</b></span><span>Reserve <b>${money(p.reserveHeld)}</b></span>${p.fixed?`<span>Inbound + unpaid setup <b>${money(p.fixed)}</b></span>`:''}</div><p class="remaining ${p.need>s.seller.cash?'negative':''}">${money(s.seller.cash-p.need)} remaining after this commitment</p><p class="muted">This reserve is your planning buffer for failed orders; it is held cash.</p></section>`:alert('Funding cannot be verified until costs and fees are available.')}${!eligible(e)?alert(e.reasons.map(esc).join('<br>')||'Review before saving.'):''}<div class="actions">${btn('← Compare prices','step-2')}${btn('Hold','hold')}${btn('Save my test →','approve',true,!eligible(e))}</div>`;}
  function orders(){if(simulation)return simulationReview();if(!review&&!compatible())return intro('Review the same test.','No completed orders are recorded for your new test yet.')+alert('You can inspect the separate historical ₹189 walkthrough to see how completed outcomes inform the next decision.')+`<div class="actions">${btn('Historical example','review-example')}${btn('Simulate orders at '+money(chosen),'simulate',true,!pick(evaluate())?.econ||(evaluate().fees.warehouse&&!evaluate().proc.known))}</div>`;const L=M.ledger(P.COHORT,s);return intro('8 closed. 1 still pending.','Historical walkthrough: six kept, two intact returns and one pending. These are not outcomes of your newly selected price.')+`<div class="order-strip">${L.rows.map(x=>`<div class="order ${x.status}"><span>${x.id}</span><b>${x.status==='kept'?'✓':x.status==='pending'?'…':'↩'}</b><small>${{kept:'Kept',rto:'RTO',return:'Returned',pending:'Pending'}[x.status]}</small></div>`).join('')}</div><div class="review-metrics"><div><span>Closed-order contribution</span><b class="green">${money(L.contribution)}</b></div><div><span>Cash movement · all 9</span><b>${money(L.cash)}</b></div><div><span>Recovered stock · 2 units</span><b>${money(L.inventoryValue)}</b></div></div><p class="one-reason">Some money is tied up in returned stock and the pending order.</p><div class="update-strip"><div><span>Return charge</span><b>₹153 <i>→</i> ₹165</b></div><div><span>Historical ₹189 estimate / dispatch</span><b>₹14.55 <i>→</i> ₹11</b></div></div>`+fold('See order reconciliation and learning rule',ledger(L))+actions('Review my next batch →',review?'step-5':'apply');}
  function next(e){if(simulation)return simulationNext();if(!review)return intro('Review outcomes first.','Use completed results to decide the next batch.')+actions('Review orders →','step-4');const L=M.ledger(P.COHORT,s),n=M.nextDecision(e.effectiveState,L,e);return intro('Review ₹189. Wait before buying more.','Price and stock are separate decisions. You stay in control of both.')+`<div class="next-decisions"><section><span class="eyebrow">PRICE</span><b class="decision-number">₹189</b><h2>Recalculate with completed outcomes</h2><p>${money(e.rows[0].econ.expected)} per dispatch using the updated outcome mix and current fee rule. This is a new calculation, separate from historical settlement receipts.</p></section><section><span class="eyebrow">STOCK</span><b class="decision-word">Wait</b><h2>Resolve one pending order</h2><p>Close D9 and check recovery and cash before buying the next batch.</p></section></div><div class="stock-comparison"><div><span>Relist 2 intact units</span><b>${money(n.relist)}</b><small>Funding needed</small></div><div><span>7 new + 2 relisted</span><b>${money(n.reorder)}</b><small>Plan only; buying stays on hold</small></div></div>`+fold('Check cash and other actions',`<p>Bank cash ${money(n.bank)}. After the pending-order reserve, ${money(n.available)} is provisionally available. Reserve ${money(M.reserve(e.effectiveState))} per dispatch. Affording the ${money(n.reorder)} plan does not approve buying stock.</p><p><b>Packaging:</b> compare added costs with avoided damage losses.</p><p><b>RTO:</b> review address checks, reconfirmation and operational issues.</p><p><b>Bundles:</b> compare full pack economics, including transfer, weight, packing, returns and displaced separate sales.</p><p><b>Clearance:</b> compare future avoidable cash costs for owned stock. Use replacement costs when restocking.</p>`)+`<div class="actions">${btn('Compare alternatives','alternatives')}${btn('Save hold on new stock','next-hold',true)}</div>`;}
  function calculation(e){const f=e.fees;if(!f.ok)return alert(f.errors.map(esc).join('<br>'));return `<p><b>Forward shipping = half the selected reverse tariff.</b> This is the rule selected for this prototype, not a live Meesho tariff connection.</p><div class="table-scroll"><table><tr><th>Calculation</th><th>Amount</th></tr><tr><td>Seller price = buyer-facing price</td><td>${money(chosen)}</td></tr><tr><td>Selected reverse tariff (${esc(f.taxBasis)} of GST)</td><td>${money(f.reverseListed)}</td></tr><tr><td>Forward base</td><td>${money(f.forward.base[0])}</td></tr><tr><td>GST on forward shipping</td><td>${money(f.forward.gst[0])}</td></tr><tr><td>Warehouse handling, including GST</td><td>${money(f.handling.gross[0])}</td></tr><tr><td>Other settlement deductions</td><td>${money(f.other)}</td></tr><tr><td><b>Estimated bank transfer</b></td><td><b>${money(f.payout[0])}</b></td></tr><tr><td>Total charge per customer return</td><td>${money(f.returns[0])}</td></tr></table></div><p>Tariff: ${esc(f.returnSource)}, recorded ${esc(f.date)}. Carrier: ${esc(f.carrier)}; chargeable weight: ${f.weight} g; destination: ${esc(f.zone)}. Self-shipping uses the half-return rule without a separate location multiplier. Warehouse handling changes with destination. The model adds delivered-order handling to forward shipping; whether these overlap needs confirmation before live use.</p><p>Chargeable weight is entered directly; no volumetric divisor is invented. Reverse fees include GST once. Intact returned stock retains acquisition value; damaged stock loses only its unrecoverable value.</p><p class="formula">Contribution = kept share × kept earnings + RTO share × RTO outcome + return share × return outcome.</p><p>Product cost, preparation and failed-order losses are outside the bank-transfer deduction. Reserve is held cash, not an expense. Storage is excluded from this model. Seller output GST, credits and TCS/TDS require separate reconciliation.</p><div class="table-scroll"><table><tr><th>Your price</th><th>Calculated transfer</th><th>Product cost ceiling at target</th></tr>${e.rows.map(q=>`<tr><td>${money(q.buyer)}</td><td>${money(q.transfer)}</td><td>${money(q.ceiling?.minimum)}</td></tr>`).join('')}</table></div><p>Historical panel references remain ₹189 → ₹96 and ₹210 → ₹116. They are separate records and are not the current calculator's fee function.</p>`;}

  function simulationReview(){
    const r=PCSimulation.calculate(simulation,M,PCSellerChoice),c=simulation.counts;
    const controls=[['kept','Kept'],['rto','RTO'],['returned','Customer returned'],['pending','Pending'],['damaged','Damaged customer returns']].map(([key,label])=>`<label>${label}<input type="number" min="0" max="${simulation.total}" step="1" data-sim="${key}" value="${c[key]??''}"></label>`).join('');
    const signals=simulation.signals||{};const signalFields=[['impressions','Product impressions'],['clicks','Product clicks'],['orders','Orders placed'],['stockAge','Stock age (days)'],['clearAge','Your clearance review age (days)'],['marketLow','Current matched-offer low (₹)'],['marketHigh','Current matched-offer high (₹)'],...(simulation.base.product.fulfilment==='Warehouse'?[['nextInbound','Next batch warehouse transport (₹)']]:[])].map(([key,label])=>`<label>${label}<input type="number" min="0" data-signal="${key}" value="${signals[key]??''}" placeholder="Optional"></label>`).join('');
    const signalPanel=fold('Optional: demand, market and stock signals','<p>Enter figures for the same period. These are editable simulation inputs.</p><div class="settings-grid">'+signalFields+'</div>');
    const header=intro('Simulate orders at '+money(simulation.price),'Explore possible outcomes for your '+simulation.total+'-dispatch test. These counts are scenarios, not a sales forecast.')+`<div class="settings-grid simulation-controls">${controls}</div><p class="muted">Kept + RTO + returned + pending must total ${simulation.total}. Damaged returns are part of customer returns.</p>`+signalPanel;
    if(r.errors.length)return header+alert(r.errors.map(esc).join('<br>'));
    const L=r.L;
    return header+`<div class="review-metrics"><div><span>Closed-order contribution</span><b class="${L.contribution<0?'negative':'green'}">${money(L.contribution)}</b></div><div><span>Cash movement · all ${simulation.total}</span><b>${money(L.cash)}</b></div><div><span>Recovered stock · ${L.intactUnits} units</span><b>${money(L.inventoryValue)}</b></div></div><div class="update-strip"><div><span>Simulated closed outcomes</span><b>${L.closed} / ${simulation.total}</b></div><div><span>Next contribution / dispatch</span><b>${money(r.e.choice?.econ?.expected)}</b></div></div>`+
      fold('See simulated receipts and learning',`<p>Kept-order transfer ${money(simulation.transfer)}; total charge per customer return ${money(simulation.returnFee)}. Values come from the price and fee settings captured at simulation start.</p><p>Settlements ${money(L.settlements)}; return/RTO charges ${money(L.reverseCharges)}; recovered inventory ${money(L.inventoryValue)}. Period result after entered batch fixed costs: ${money(r.periodProfit)}. Reserve stays separate from expense.</p><p>Updated kept / RTO / return: ${r.next.mix.k.toFixed(2)}% / ${r.next.mix.r.toFixed(2)}% / ${r.next.mix.q.toFixed(2)}%. Only closed outcomes count. Prior weight 20 is an uncalibrated modeling setting.</p><div class="table-scroll"><table><tr><th>Order</th><th>Outcome</th><th>Contribution</th><th>Cash</th></tr>${L.rows.map(x=>`<tr><td>${x.id}</td><td>${x.status}</td><td>${x.contribution===null?'Pending':money(x.contribution)}</td><td>${money(x.cash)}</td></tr>`).join('')}</table></div>`)+
      `<div class="actions">${btn('Back to price','step-2')}${btn('Review next decision →','apply-simulation',true,!L.closed)}</div>`;
  }
  function simulationNext(){
    const r=PCSimulation.calculate(simulation,M,PCSellerChoice);if(r.errors.length)return simulationReview();
    return intro('Next decision at '+money(simulation.price),'Based on your simulated outcomes. Price and stock remain your decisions.')+
      `<div class="next-decisions"><section><span class="eyebrow">PRICE</span><b class="decision-number">${money(simulation.price)}</b><h2>${r.pricePass?'Price clears the earnings check':'Review price or operating losses'}</h2><p>${money(r.e.choice?.econ?.expected)} per dispatch with the updated mix. Customer demand has not been predicted.</p></section><section><span class="eyebrow">STOCK</span><b class="decision-word">${r.canRestock?'Review':'Wait'}</b><h2>${r.canRestock?'Next batch is affordable':'Review the next batch'}</h2><p>${esc(r.reason)}</p></section></div><div class="stock-comparison"><div><span>Relist ${r.relistUnits} intact units</span><b>${money(r.relist)}</b><small>Funding needed</small></div><div><span>${r.buy} new + ${r.relistUnits} relisted</span><b>${money(r.reorder)}</b><small>Includes entered next-batch transport; setup already paid is excluded</small></div></div>`+
      `<section class="decision-help"><h2>Lifecycle signals to review</h2>${r.signals.map(t=>`<p>${esc(t)}</p>`).join('')}${r.clearance?'<p><b>Review aged inventory before committing to another batch.</b></p>':''}</section>`+fold('Cash and operating checks',`<p>Bank cash ${money(r.bank)}. Pending-order cash provision: ${money(r.pendingExposure)} (${money(r.pendingPerUnit)} each). After this provision: ${money(r.available)}. No pending settlement is treated as received. Damaged returns: ${simulation.counts.damaged}.</p><p>High damaged returns: review packaging and recovery. High RTO: review fulfilment and reconfirmation. Low contribution: adjust price, costs or pack economics. Stock already owned requires an avoidable-cost clearance check; replacement stock requires its acquisition cost.</p>`)+
      `<div class="actions">${btn('Edit simulated outcomes','step-4')}${btn('Compare prices','sim-compare')}${btn('Save simulation decision','sim-save',true)}</div>`;
  }

  function ledger(L){return `<p>Example orders from the submission walkthrough. No live Meesho order feed is connected.</p><div class="table-scroll"><table><tr><th>Order</th><th>Outcome</th><th>Contribution</th><th>Cash</th></tr>${L.rows.map(x=>`<tr><td>${x.id}</td><td>${x.status}</td><td>${x.contribution===null?'Open':money(x.contribution)}</td><td>${money(x.cash)}</td></tr>`).join('')}</table></div><p>₹576 settlements − ₹165 reverse − ₹440 product − ₹40 outside = −₹69 closed cash. Add ₹110 stock to get ₹41 contribution. Pending D9 ties up ₹60 more: total cash movement −₹129.</p><p>Updated kept / RTO / return shares: 82.14 / 7.14 / 10.71. Only eight closed outcomes count.</p><p class="formula">Updated share = (20 × prior share + outcome count) / 28.</p><p>The prior weight 20 is uncalibrated. These outcomes do not establish demand or confidence. Returned stock is inventory, never a bank receipt.</p>`;}
  function evidence(){return `<h2>Cable example: inputs and sources</h2><dl class="evidence-list"><dt>Price and bank transfer</dt><dd>The supplied historical seller panel shows ₹189 → ₹96 and ₹210 → ₹116. These historical records are preserved for reference. The current calculator uses your chosen selling price minus the selected reverse tariff divided by two, applicable shipping GST and other deductions.</dd><dt>Economics carried forward</dt><dd>₹55 product; ₹5 packing and other dispatch costs; 85% kept, 5% RTO and 10% customer return. Default reverse tariff ₹153 before GST (Valmo, up to 500 g); forward tariff is half that amount. Intact recovery at baseline. Cash ₹1,000; initial stock limit nine units.</dd><dt>Comparison and order examples</dt><dd>M1–M6 and the nine-dispatch continuation are demonstration records from the submission. The separate 28 September public audit screened five offers and excluded them for specification, stock or channel differences. It is not the example comparison set.</dd><dt>Product image</dt><dd>Reference manufacturer photograph of a white 5 m CAT5e cable. It does not establish the historical seller item's conductor, measured packed weight or brand.</dd><dt>Learning and seller control</dt><dd>Completed outcomes update the calculation. Prices, cash limits and stock decisions remain under seller control. No live Meesho feed or warehouse tariff is connected.</dd></dl>${btn('Open the cable example','reset')}<p>Source: CoffeeBeans_IITRoorkee.pdf, physical pages 5–8 and 11–12. No listing edits or purchases are made.</p>`;}
  function offers(e){return `<h2>Cable comparison examples</h2><p>Comparison checklist: CAT5e grade, 5 m length, pack of one, connector type, conductor/quality, availability and equivalent delivery/tax basis. Similar images alone are insufficient.</p><div class="offer-list">${e.cmp.list.map(x=>`<article><span>${esc(x.id)} · ${money(x.price)}</span><b>${x.status==='accepted'?'Included':'Excluded'}</b><p>${esc(x.what||'Cable comparison example')} · ${esc(x.status==='accepted'?(x.price===200?'Included comparison example; matching not independently revalidated':'Included comparison example; verify matching before live use'):x.reason)}</p></article>`).join('')}</div><p>Median ${money(e.cmp.median)} is a reference only. You may select any positive price; the calculator computes its payout.</p><p>The supplied panel already suggested ₹189. PriceCompass adds outcome-cost checks, cash limits and review. Example provenance is available in Inputs & evidence.</p>`;}
  function tools(){const c=PCSellerChoice.config(s);return `<h2>Demo controls</h2><p>Model inputs for exploring scenarios; these are not questions a new seller must answer.</p><div class="settings-grid">${field('Kept orders (%)','k',s.mix.k)}${field('RTO (%)','r',s.mix.r)}${field('Customer returns (%)','q',s.mix.q)}${field('Returned stock losing value (%)','delta',s.fees.delta)}<label>Destination zone<select data-delivery="zone">${['local','regional','national'].map(z=>`<option ${c.zone===z?'selected':''}>${z}</option>`).join('')}</select></label><label>Earnings target basis<select data-select="denominator"><option value="dispatch" ${s.seller.denominator==='dispatch'?'selected':''}>Average per parcel sent</option><option value="kept" ${s.seller.denominator==='kept'?'selected':''}>Each kept order</option></select></label></div><p>Forward shipping uses half the selected reverse tariff. Each challenge below restores the baseline before changing one condition.</p><div class="challenge-buttons">${[['comparable','Comparable fails'],['returns','Return charge + damage'],['cash','₹700 cash / MOQ 10'],['weight','Packed weight 520 g'],['cost','Acquisition ₹90']].map(([k,t])=>btn(t,'demo-'+k)).join('')}${btn('Reset demo','reset')}</div>${challenge?`<div class="challenge-result">${challenge}<p>Saved choice: ${esc(approved?.state)}.</p></div>`:''}`;}
  function caseRationale(){return `<h2>Why we chose a cable</h2><p>We selected a case with a real pricing decision to examine.</p><dl class="evidence-list"><dt>1. An existing decision we can inspect</dt><dd>The historical supplier panel showed ₹210 → ₹116 bank transfer and a proposed ₹189 → ₹96. It gives us an evidenced starting point for comparing the money behind a price.</dd><dt>2. Matching can go wrong in visible ways</dt><dd>Grade, length, conductor, pack and availability matter. Our actual audit excluded CAT6, a 10 m cable, unavailable stock and weak cross-channel references. A similar photograph alone is insufficient.</dd><dt>3. One product across the journey</dt><dd>The same SKU connects price, failed-order costs, cash commitment and a later stock decision. Judges can change an input and inspect the resulting decision.</dd><dt>What this demonstrates</dt><dd>A working calculation and decision process, with price-to-transfer evidence. It does not demonstrate live demand, a measured profit uplift or an observed nine-order pilot.</dd><dt>Where we validate next</dt><dd>Clothing adds size, fit and variant-level returns; fragile goods add damage and packaging. The workflow can extend, but each category needs its own matching rules, fees and completed outcomes.</dd></dl><p><b>Presenter answer:</b> “We chose the cable because we had actual supplier-panel price and transfer evidence, and clear matching errors to investigate. It makes our decision logic inspectable. Category-wide performance is the next validation task.”</p>`;}
  function panel(type){$('panel').dataset.view=type;$('panel-content').innerHTML=type==='why'?caseRationale():type==='evidence'?evidence():type==='offers'?offers(evaluate()):type==='maths'?decisionProof(evaluate()):tools();$('panel').showModal();}
  function render(focus=false){const e=evaluate();$('progress').innerHTML=names.map((n,i)=>`<button data-action="step-${i+1}" ${step===i+1?'aria-current="step"':''}><span>${i+1}</span><b>${n}</b></button>`).join('');$('product-strip').innerHTML=`<span>CAT5e cable · 5 m · Pack of 1</span><span>${step>1?'Price candidate <b>'+money(chosen)+'</b>':'Your first online listing'}</span>`;$('case-label').textContent=s.mode==='real'?'Actual evidence · HOLD':'Demo case';$('main').innerHTML=[product,()=>compare(e),()=>test(e),orders,()=>next(e)][step-1]();$('feedback').textContent=notice;if(focus){$('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
  function reset(){s=P.base();step=1;chosen=189;approved=null;review=null;notice='';challenge='';history=false;simulation=null;}
  function approve(){const e=evaluate();if(!eligible(e))return false;e.choice=pick(e);approved=M.snapshot(s,e,'Test '+money(chosen));approved.feeContext=JSON.stringify({delivery:PCSellerChoice.config(s),product:s.product});review=null;history=false;simulation=null;return true;}
  function demo(k){reset();approve();step=2;if(k==='comparable')M.change(s,'comparables','Comparable fails',x=>{x.register[2].status='excluded';x.register[2].reason='Wrong grade on re-check';});if(k==='returns')M.change(s,'fees','Charge and damage changed',x=>{x.delivery={...PCSellerChoice.config(x),returnOverride:165};x.fees.delta=50;});if(k==='cash'){M.change(s,'seller','Cash and MOQ changed',x=>{x.seller.cash=700;x.seller.moq=10;});step=3;}if(k==='weight')M.change(s,'product','Packed weight changed',x=>x.product.packedWeight=520);if(k==='cost'){M.change(s,'costs','Product cost changed',x=>x.costs.C=90);chosen=210;}const e=evaluate();challenge='<b>Updated calculation</b><p>'+e.rows.map(x=>money(x.buyer)+': '+money(x.econ?.expected)+' / dispatch').join('; ')+'. Cash needed: '+money(e.proc.need)+'.</p>';}
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;if(['why','evidence','offers','presenter','maths'].includes(a)){panel(a);return;}if(a==='close'){$('panel').close();return;}
    if(a==='reset'){reset();$('panel').close();}else if(a==='mode'){const mode=s.mode==='real'?'scenario':'real';reset();s.mode=mode;step=2;$('panel').close();}else if(a==='back')step=Math.max(1,step-1);else if(a.startsWith('step-'))step=+a.slice(5);
    else if(a.startsWith('choose-')){selectPrice(+a.slice(7));notice='';}
    else if(a==='approve'){if(!approve())return;step=4;notice='Test saved in this demo. Your listing has not changed.';}
    else if(a==='self-ship'){M.change(s,'product','Seller changed fulfilment',x=>{x.product.fulfilment='Self-ship through Meesho logistics';x.delivery={...PCSellerChoice.config(x),returnOverride:null,observedReturn:null};});simulation=null;review=null;history=false;step=2;notice='Same price, recalculated for shipping from your location.';}
    else if(a==='simulate'){const e=evaluate();if(!e.choice?.econ||(e.fees.warehouse&&!e.proc.known))return;simulation=PCSimulation.start(s,e,chosen);history=false;review=null;step=4;notice='Simulation uses your selected price and costs. No live orders are created.';}
    else if(a==='apply-simulation'){const result=PCSimulation.calculate(simulation,M,PCSellerChoice);if(result.errors.length||!result.L.closed)return;review=result;step=5;notice='Next decision calculated from simulated outcomes.';}
    else if(a==='sim-compare'){const result=PCSimulation.calculate(simulation,M,PCSellerChoice);s=result.next;s.snapshots.forEach(x=>x.state='Needs review');simulation=null;review=null;step=2;notice='Comparison now uses the simulated outcome mix.';}
    else if(a==='sim-save'){const result=PCSimulation.calculate(simulation,M,PCSellerChoice);if(!result.errors.length)notice='Simulation decision saved for this session. No stock purchase or listing change made.';}
    else if(a==='review-example'){reset();history=true;step=4;notice='Opened the separate historical ₹189 walkthrough. Its recorded payouts are unchanged.';}
    else if(a==='apply'){if(!compatible())return;const snapshots=s.snapshots;review=M.update(s,M.ledger(P.COHORT,s),20);s=review.next;s.delivery={...PCSellerChoice.config(s),observedReturn:review.after.R};s.snapshots=snapshots;s.snapshots.forEach(x=>x.state='Needs review');step=5;notice='Completed outcomes applied.';}
    else if(a==='alternatives'){step=2;notice='Earnings use updated outcomes. Saving a fresh test clears the prior review.';}
    else if(a==='hold'||a==='next-hold'){M.snapshot(s,evaluate(),a==='hold'?'Hold first test':'Hold new procurement');notice='Hold saved. No listing or stock order changed.';}
    else if(a.startsWith('demo-')){demo(a.slice(5));render(true);panel('presenter');return;}render(true);
  });
  function sync(t){const k=t.dataset.field;if(!k)return false;if(k==='totalCost'){const total=t.value===''?null:Number(t.value);M.change(s,'costs','Combined cost changed',x=>{x.costs.C=total!==null&&Number.isFinite(x.costs.o)&&total>=x.costs.o?total-x.costs.o:null;});review=null;history=false;simulation=null;notice=total!==null&&total<s.costs.o?'Total cost cannot be below packing cost. Check Optional details.':'Costs updated.';return true;}const area=k==='packedWeight'?'product':['inbound','setup'].includes(k)?'delivery':['C','o'].includes(k)?'costs':['R','delta'].includes(k)?'fees':['k','r','q'].includes(k)?'mix':'seller',v=t.value===''?null:Number(t.value);if(area==='delivery')s.delivery=PCSellerChoice.config(s);if(s[area][k]!==v){M.change(s,area==='mix'?'outcomes':area==='delivery'?'fees':area,k+' changed',x=>x[area][k]=v);review=null;history=false;simulation=null;notice='Inputs updated. Review the price and cash before saving.';}return true;}
  function selectPrice(value){if(value!==chosen){M.change(s,'seller','Seller selected price',()=>{});review=null;history=false;simulation=null;}chosen=value;}
  function syncPrice(t){if(t.hasAttribute('data-seller-price')){selectPrice(t.value===''?null:Number(t.value));return true;}return false;}
  function refreshPriceInput(t){
    if(step!==2)return;
    const preview=document.createElement('div');preview.innerHTML=compare(evaluate());
    // Update outputs while retaining the input being typed into and its cursor.
    const targets=['.price-result','.decision-help','.batch-summary','.actions','details'];
    for(const sel of targets){const old=$('main').querySelector(sel),next=preview.querySelector(sel);if(old&&next){if(sel==='details')next.open=old.open;old.replaceWith(next);}else if(old&&!next){old.remove();}else if(!old&&next&&sel==='.decision-help'){$('main').querySelector('details').before(next);}}
    $('main').querySelector('.range-note')?.remove();const range=preview.querySelector('.range-note');if(range)$('main').querySelector('.seller-price').after(range);
    $('main').querySelector('.alert')?.remove();const warning=preview.querySelector('.alert');if(warning)$('main').querySelector('details').before(warning);
    $('product-strip').lastElementChild.innerHTML='Price candidate <b>'+money(chosen)+'</b>';
  }
  document.addEventListener('input',e=>{if(syncPrice(e.target))refreshPriceInput(e.target);else sync(e.target);});
  document.addEventListener('change',e=>{const t=e.target;if(t.dataset.signal&&simulation){simulation.signals[t.dataset.signal]=t.value===''?null:Number(t.value);review=null;step=4;render();$('main').querySelectorAll?.('details').forEach(d=>d.setAttribute('open',''));return;}if(t.dataset.sim&&simulation){simulation.counts[t.dataset.sim]=t.value===''?null:Number(t.value);review=null;step=4;render();return;}const open=Array.from($('main').querySelectorAll?.('details[open]')||[]).map(d=>d.querySelector('summary')?.textContent);if(syncPrice(t)){refreshPriceInput(t);return;}if(sync(t)){render();if($('panel').open&&$('panel').dataset.view==='presenter')$('panel-content').innerHTML=tools();$('main').querySelectorAll?.('details').forEach(d=>{if(open.includes(d.querySelector('summary')?.textContent))d.setAttribute('open','');});return;}if(t.hasAttribute('data-private'))M.change(s,'costs','Privacy changed',x=>{x.costs.private=t.checked;x.costs.C=t.checked?null:55;});else if(t.dataset.select==='fulfilment')M.change(s,'product','Fulfilment changed',x=>{x.product.fulfilment=t.value==='warehouse'?'Warehouse':'Self-ship through Meesho logistics';});else if(t.dataset.select==='denominator')M.change(s,'seller','Minimum basis changed',x=>x.seller.denominator=t.value);else if(t.dataset.delivery){M.change(s,'fees','Delivery setting changed',x=>{x.delivery=PCSellerChoice.config(x);x.delivery[t.dataset.delivery]=t.type==='checkbox'?t.checked:t.value;});}else return;review=null;history=false;simulation=null;render();if($('panel').open&&$('panel').dataset.view==='presenter')$('panel-content').innerHTML=tools();$('main').querySelectorAll?.('details').forEach(d=>d.setAttribute('open',''));});
  render();
})();
</script></body></html>
