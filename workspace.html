const goals={competitive:['Competitive start','Lowest eligible quoted offer'],earnings:['Earnings per order','Prioritise kept-order earnings'],release:['Release cash','Compare future cash from stock'],help:['Help me decide','See alternatives side by side']};
function products(){return `<div class="heading"><div><div class="eyebrow">YOUR CATALOG</div><h1>A clearer next price decision</h1><p class="muted">Choose a product to review its price, costs and affordable stock.</p></div>${status('2 separate cases','neutral')}</div><div class="strip"><strong>What this adds</strong><span>Price suggestion &nbsp;→&nbsp; Your costs &nbsp;→&nbsp; Affordable stock &nbsp;→&nbsp; Your decision</span></div><section class="panel flush"><div class="table-wrap"><table><thead><tr><th>Product / specification</th><th>Buyer price</th><th>Transfer preview</th><th>Paid stock</th><th>Next action</th></tr></thead><tbody>${['cable','caseB'].map(id=>{const q=F.fixtures[id].quotes[id==='cable'?1:0];return `<tr><td>${product(id)}</td><td><b>${money(q.buyer)}</b></td><td>${money(q.transfer)}</td><td>${states[id].owned} units</td><td>${btn('Review with PriceCompass →','review',id==='cable'?'primary':'',`data-case="${id}"`)}</td></tr>`;}).join('')}</tbody></table></div></section><p class="footnote">Select a case explicitly. Historical records and supplied model inputs are separate; see Case details for origins.</p><section class="panel" style="margin-top:30px"><h3>Keep the decision in your hands</h3><p class="muted">Understand the price instruction, retain cash for unresolved outcomes, and save a limited test only after the checks pass.</p><div class="actions">${btn('Review example outcomes','orders','text')}${btn('View saved decisions','history','text')}</div></section>`;}
function cashSummary(r){const b=r.cash;return `<h3>Cash to keep available</h3><div class="metric">${money(b.total)}</div><p class="muted">${b.quantity??'–'} dispatches · ${b.newUnits??'–'} new units</p>${kv('Received available cash',money(c().cash))}${kv('Unpaid acquisition',money(b.procurement))}${kv('Preparation / outside',money(b.preparation))}${kv('Retained reserve',money(b.reserve))}${kv('Separate upfront cost',money(c().upfront))}<p>${status(b.reason||'Complete inputs',b.valid?'good':'')}</p><small>Reserve is retained money, not an incurred expense or a universal platform fee. Paid stock still has an economic cost.</small>`;}
function reviewNotice(r){return r.reasons.length?`<div class="notice" role="status"><b>Review needed</b><p>${r.reasons.map(esc).join(' ')}</p></div>`:'';}
function inputs(){const x=c();return `<div class="cols"><section class="panel"><div class="eyebrow">STEP 1 OF 3</div><h2>What matters for this test?</h2><div class="objectives">${Object.entries(goals).map(([id,[name,desc]])=>btn(`${name}<small>${desc}</small>`,'goal',x.objective===id?'active':'',`data-goal="${id}" aria-pressed="${x.objective===id}"`)).join('')}</div><h3>Your costs and limits</h3><div class="fields">${field('Acquisition cost / unit (₹)','cost',x.cost,x.private?'disabled':'')}${field('Packaging / outside cost (₹)','outside',x.outside)}${field('Received available cash (₹)','cash',x.cash)}${field('Paid owned stock (units)','owned',x.owned,'step="1"')}${field('Seller dispatch cap (units)','cap',x.cap,'step="1"')}${field('Reorder MOQ (new units)','moq',x.moq,'step="1"')}${field('Minimum acceptable earnings (₹)','minimum',x.minimum)}${select('Minimum earnings unit','unit',[['kept','Per kept order'],['dispatch','Expected per dispatch']])}${select('Stock plan','procure',[['auto','Affordable mix · owned first'],['owned','Use owned stock only'],['plan','Owned + specified new units']])}${x.procure==='plan'?field('New units to buy · updates total cap','newUnits',x.newUnits):''}</div><label class="check"><input type="checkbox" id="private" ${x.private?'checked':''}> Keep acquisition cost private</label><small>Clears acquisition cost from the active calculation. Inputs and decisions stay in page memory unless you explicitly export.</small><details><summary>Cash policy & quote conditions</summary><div class="fields two">${field('Reserve per dispatch (₹)','reserve',x.reserve)}${field('Separate upfront cash (₹)','upfront',x.upfront)}${field('Packed weight (g)','weight',x.weight)}${select('Shipping route','route',[['Standard','Standard'],['Changed','Changed route']])}</div><label class="check"><input type="checkbox" id="quote-valid" ${x.quoteValid?'checked':''}> Use supplied demo quote assumptions as current for this scenario</label><small>Rechecking this box is an explicit scenario assumption; it does not fetch a live quote.</small></details><div id="input-alert">${reviewNotice(e())}</div><div class="actions">${btn('Compare options →','next','primary')}</div></section><aside><section class="panel" id="cash-live">${cashSummary(e())}</section><p class="footnote">A stock cap limits exposure. It is not a sales forecast.</p></aside></div>`;}
function candidate(r){const result=e(),chosen=result.selected?.id===r.id;return `<article class="candidate ${chosen?'chosen':''}"><div class="eyebrow">${current==='cable'?(r.id==='Low'?'COMPETITIVE START':'HIGHER EARNINGS / DISPATCH'):'CANDIDATE '+r.id}</div>${status(chosen?'Selected for review':r.eligible?'Eligible alternative':r.earnings?'Earnings pass · review needed':'Earnings not confirmed',chosen||r.eligible?'good':'')}<p class="muted" style="margin:17px 0 0">Buyer pays</p><div class="metric accent">${money(r.buyer)}</div>${kv('You enter',money(r.entry))}${kv('Transfer preview',money(r.transfer))}<p class="muted" style="margin:18px 0 0">Expected earnings per dispatch</p><div class="earnings">${money(r.expected)}</div><small>Per kept order: ${money(r.kept)}</small>${c().private?`<p class="notice">Acquisition cost must be at most ${money(r.threshold)} to meet your minimum on the selected unit. Cash and positive expected earnings still need checking.</p>`:''}<div class="gates">${[['Earnings',r.earnings],['Comparables',r.comparable],['Quote',r.quote],['Cash',r.cash]].map(([l,v])=>`<span class="${v?'pass':'fail'}">${v?'✓':'!'} ${l}</span>`).join('')}</div>${btn(chosen?'Selected':`Choose ${money(r.buyer)} offer`,'choose','',`data-id="${r.id}" ${!r.eligible?'disabled':''}`)}</article>`;}
function releaseCash(){const rows=M.future(futures);return `<section class="panel"><h2>Compare future cash from owned stock</h2><p class="muted">Enter a common time horizon’s receipts, avoidable costs and terminal proceeds for remaining stock. Do not charge historic acquisition again or count sold stock twice.</p><div class="table-wrap"><table><thead><tr><th>Option</th><th>Future receipts ₹</th><th>Avoidable costs ₹</th><th>Unsold stock proceeds ₹</th><th>Net future cash</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r.name}</td>${['receipts','costs','terminal'].map(k=>`<td><input aria-label="${r.name} ${k}" type="number" min="0" data-future="${i}" data-part="${k}" value="${r[k]??''}"></td>`).join('')}<td id="future-${i}">${money(r.net)}</td></tr>`).join('')}</tbody></table></div><div class="notice" id="future-notice">${rows.some(r=>r.net===null)?'Enter missing option inputs before comparing.':'Highest stated future cash: '+rows.reduce((a,b)=>a.net>b.net?a:b).name+'. Validate receipts, timing and quotes before committing.'} This scenario does not establish buyer demand.</div></section>`;}
function comparisons(){const r=e();let rows=current==='caseB'?[r.rows[1],r.rows[2]]:r.rows;return `<div class="heading"><div><div class="eyebrow">STEP 2 OF 3</div><h1>Compare your options</h1><p class="muted">${goals[c().objective][0]} · minimum ${money(c().minimum)} ${c().unit==='kept'?'per kept order':'expected per dispatch'}</p></div>${btn('Edit inputs','edit','text')}</div>${reviewNotice(r)}${current==='caseB'?`<div class="notice"><b>Lowest earnings pass: ${r.earningsFirst?.id??'none'}</b> · This is an earnings check only. Unresolved comparables prevent overall approval.</div>`:''}${c().objective==='help'?'<div class="notice">There is no universal winner. Choose an eligible alternative after comparing earnings and buyer response.</div>':''}${c().objective==='release'?releaseCash():''}<div class="cards">${rows.map(candidate).join('')}</div>${current==='caseB'?`<details><summary>Original and C candidates</summary><div class="cards">${[r.rows[0],r.rows[3]].map(candidate).join('')}</div></details>`:''}${current==='cable'?`<p class="mini">At the original mix and costs, ₹189 needs <b>more than 116.8% more comparable mature dispatches</b> to beat ₹210; ₹210 wins if its volume stays above <b>46.1%</b> of ₹189’s.</p>`:''}<section class="panel"><details><summary>How this is calculated</summary><p>Contribution is transfer less acquisition and outside cost, adjusted for each outcome. Transfers are already net of included fees. Intact recovered inventory is an asset, never an extra cash receipt.</p><div class="fields">${field('Kept (%)','kept',c().kept)}${field('RTO (%)','rto',c().rto)}${field('Customer return (%)','returned',c().returned)}${field('Extra return charge (₹)','returnFee',c().returnFee)}${field('Returned stock damaged (%)','damage',c().damage)}</div><div class="table-wrap"><table><thead><tr><th>Buyer</th><th>Kept</th><th>RTO</th><th>Customer return</th><th>Expected / dispatch</th></tr></thead><tbody>${r.rows.map(a=>`<tr><td>${money(a.buyer)}</td><td>${money(a.kept)}</td><td>${money(a.rto)}</td><td>${money(a.returned)}</td><td>${money(a.expected)}</td></tr>`).join('')}</tbody></table></div><small>Expected = kept probability × kept contribution + RTO probability × RTO contribution + return probability × return contribution. Round only for display.</small></details><details><summary>Which offers were compared?</summary><div class="table-wrap"><table><thead><tr><th>Peer buyer price</th><th>Review</th></tr></thead><tbody>${c().peers.map(p=>`<tr><td>${money(p.price)}</td><td>${p.reason}</td></tr>`).join('')}</tbody></table></div><p class="mini">${current==='cable'?'Accepted median ₹200 is context, not a quote or a selection rule.':'Peer attributes remain unresolved. No candidate has complete comparability approval.'}</p></details><details><summary>Check another seller entry price</summary>${field('Unquoted seller entry (₹)','custom',c().custom)}<p class="mini">Any price entered here needs a supplied quote. Clear it to return to the supplied candidates.</p></details></section><div class="actions between sticky-actions">${btn('← Your goal and costs','edit')}${btn('Review decision →','next','primary')}</div>`;}
function decision(){const r=e(),s=r.selected;return `<div class="heading"><div><div class="eyebrow">STEP 3 OF 3</div><h1>Your decision</h1><p class="muted">A limited test, with an explicit next review.</p></div>${status(r.status,s?'good':'')}</div>${reviewNotice(r)}<section class="panel"><h2>${s?'Test a '+money(s.buyer)+' buyer offer':'Hold until the checks are complete'}</h2><p class="muted">${s?'You enter '+money(s.entry)+' using the supplied scenario quote.':c().objective==='help'?'Choose an eligible alternative in Compare options to continue.':'Resolve the input, quote, cash and comparable checks before saving a test.'}</p><div class="summary-grid"><div><small>Buyer pays</small><div class="metric accent">${money(s?.buyer)}</div><small>You enter ${money(s?.entry)}</small></div><div><small>Expected earnings / dispatch</small><div class="metric">${money(s?.expected)}</div><small>Per kept order ${money(s?.kept)}</small></div><div><small>Cash to keep available</small><div class="metric">${money(r.cash.total)}</div><small>${r.cash.quantity??'–'} units · ${r.cash.newUnits??'–'} new</small></div></div><hr><h3>Why this option?</h3><p>${s?c().preferred?'You selected an eligible alternative after reviewing the trade-off.':c().objective==='earnings'?'Highest kept-order contribution among eligible quoted candidates. Expected contribution remains visible alongside it.':'Lowest eligible quoted buyer price for a competitive start. Minimum earnings is a constraint, not the ranking objective.':'No overall pass is inferred from an earnings-only pass.'}</p><h3>Alternative</h3><p>${r.rows.filter(x=>x.id!==s?.id).map(x=>`${money(x.buyer)} buyer / ${money(x.expected)} expected · ${x.eligible?'eligible':'review needed'}`).join(' · ')}</p><div class="notice"><b>Review trigger</b><p>Review immediately after a change in cost, weight, route, fees or quote validity. Use mature outcomes for performance-led price tests. A positive small batch is not a demand forecast.</p></div><div class="actions sticky-actions">${btn('Save test decision','save','primary',!s?'disabled':'')}${btn('Choose alternative','compare')}${btn('Edit inputs','edit')}${btn('Hold','hold')}</div><p class="footnote">Saves a dated snapshot in this page only. No listing edit, procurement or dispatch is performed.</p></section>`;}
function wizard(){return context()+`<div class="steps">${['Your goal and costs','Compare your options','Your decision'].map((s,i)=>btn(`<span>${i+1}</span>${s}`,'step',step===i?'active':'',`data-step="${i}" aria-current="${step===i?'step':'false'}"`)).join('')}</div>`+[inputs,comparisons,decision][step]();}
const nextActions={positive:['Review a small next batch','Closed contribution is positive. Recheck replacement cost, cash, MOQ, lead time and quotes before replenishing. Five outcomes do not forecast demand.'],pending:['Wait for unresolved outcomes','Two pending dispatches are not kept sales, zero-loss outcomes or available receipts. Retain a reserve until return and settlement windows close.'],damaged:['Hold restock and investigate','Inspect product condition, packaging, route, actual fees and paid claims. Repricing alone cannot repair damaged stock.']};
function orders(){const l=M.lifecycle(cohort),invalid=!c().quoteValid||e().errors.length>0,action=invalid?['Correct changed economics now','Cost, weight, route, fee or quote validity changed. Refresh the affected inputs immediately; do not wait for mature outcomes.']:signal==='exposure'?['Check eligible in-stock impressions','Provide impressions, stock availability, listing eligibility, images, delivery promise and ads context. Low orders without exposure do not establish a price problem.']:signal==='response'?['Check comparable visits and placed orders','Provide visits, orders, promotions, delivery and quality context. No conversion threshold is invented; only use mature comparable outcomes for a price test.']:signal==='higher'?['Explore one higher-price test','Get fresh quotes and confirm mature viable outcomes, adequate exposure and buyer response. Under the original assumptions ₹210 needs more than 46.1% of ₹189 volume.']:nextActions[cohort];return `<div class="heading"><div><div class="eyebrow">LIFECYCLE REVIEW</div><h1>Review what actually settles</h1><p class="muted">Three separate example cohorts for the original cable at ₹189.</p></div>${btn('Explore a bundle','bundle')}</div>${product('cable')}<div class="cohorts">${[['positive','Positive settled batch'],['pending','Pending outcomes'],['damaged','Damaged returns']].map(([id,t])=>btn(t,'cohort',cohort===id?'active':'',`data-cohort="${id}"`)).join('')}</div><section class="panel"><div class="summary-grid"><div><small>${l.pending?'Closed contribution so far':'Settled contribution'}</small><div class="metric ${l.contribution<0?'':'accent'}">${money(l.contribution)}</div></div><div><small>${l.pending?'Closed-order net cash only':'Pre-resale net cash'}</small><div class="metric">${money(l.cash)}</div></div><div><small>Recovered stock asset</small><div class="metric">${money(l.stock)}</div></div></div><div class="table-wrap"><table><thead><tr><th>Example dispatch</th><th>Outcome</th><th>Contribution</th><th>Net cash</th><th>Recovered stock</th></tr></thead><tbody>${l.records.map(r=>`<tr><td>PC-${String(r.id).padStart(3,'0')}</td><td>${status(r.status,r.status==='kept'?'good':r.status==='damaged'?'bad':'')}</td><td>${money(r.contribution)}</td><td>${money(r.cash)}</td><td>${money(r.stock)}</td></tr>`).join('')}</tbody></table></div><details><summary>Why cash differs from contribution</summary><p>For four kept and one RTO: 4 × ₹96 − ₹0 RTO fee − 5 × ₹55 − 5 × ₹5 = ₹84 cash before resale. The recovered ₹55 cable remains inventory, so contribution is ₹139. Pending receipts are never counted as available cash.</p></details></section><section class="panel"><label class="field">Review signal<select id="signal">${[['outcomes','Outcome review'],['exposure','Low exposure'],['response','Weak buyer response'],['higher','Higher-price exploration']].map(([v,l])=>`<option value="${v}" ${signal===v?'selected':''}>${l}</option>`).join('')}</select></label><div class="notice ${cohort==='damaged'||invalid?'error':''}"><b>${action[0]}</b><p>${action[1]}</p></div>${btn('Review price and inputs','edit','primary')}</section>`;}
function historyPage(){return `<div class="heading"><div><div class="eyebrow">LOCAL DECISIONS</div><h1>Decision history</h1><p class="muted">Dated snapshots held in this page’s memory. Reloading clears them.</p></div>${btn('Reset demo','reset')}</div>${history.length?`<section class="panel flush"><div class="table-wrap"><table><thead><tr><th>Case / saved at</th><th>Objective / option</th><th>Cash / version</th><th>State</th><th>Actions</th></tr></thead><tbody>${history.map((h,i)=>`<tr class="history-row"><td><b>${esc(h.name)}</b><br><small>${new Date(h.time).toLocaleString()}</small></td><td>${goals[h.inputs.objective][0]}<br>${h.selected?money(h.selected.buyer)+' buyer':'Hold'}</td><td>${money(h.cash.total)}<br>Input v${h.version}</td><td>${status(h.state,h.state==='Saved test'?'good':'')}</td><td>${btn('Inspect','inspect','',`data-index="${i}"`)} ${btn('Delete','delete','text',`data-index="${i}"`)}</td></tr>`).join('')}</tbody></table></div></section>`:'<section class="panel empty"><h2>No saved decisions yet</h2><p class="muted">Review a price and save a test or an explicit hold.</p>'+btn('Review original cable','review','primary','data-case="cable"')+'</section>'}`;}
function render(){const labels={products:'Products',wizard:'PriceCompass',orders:'Orders & returns',history:'Decision history'};$('page-name').textContent=labels[route];$('nav').innerHTML=Object.entries(labels).map(([id,l],i)=>`<button data-nav="${id}" class="${route===id?'active':''}" ${route===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 ${8+i}h8M8 15h5"/></svg>${l}</button>`).join('');$('main').innerHTML=({products,wizard,orders,history:historyPage}[route])();}
function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').className='toast-show';toastTimer=setTimeout(()=>{$('toast').className='';$('toast').textContent='';},6000);}
function invalidate(){c().version++;c().preferred=null;history.filter(h=>h.case===current).forEach(h=>h.state='Needs review');}
function update(key,value){if(Object.is(c()[key],value))return;c()[key]=value;if(key==='newUnits'&&value!==null&&c().procure==='plan'){c().cap=c().owned+value;if($('f-cap'))$('f-cap').value=c().cap;}invalidate();if(['cost','outside','weight','route','returnFee'].includes(key))c().quoteValid=false;}
function navigate(r){route=r;render();window.scrollTo(0,0);}
function close(){ $('dialog').close();dialogKind='';returnFocus?.focus();}
function modal(title,body,kind){returnFocus=document.activeElement;dialogKind=kind;$('dialog').innerHTML=`<div class="heading"><h2 id="dialog-title">${title}</h2>${btn('×','close','','aria-label="Close drawer"')}</div>${body}`;if(!$('dialog').open)$('dialog').showModal();$('dialog').querySelector('button').focus();}
function demo(){modal('Demo controls',`<p class="muted">Named presets change real inputs. Existing decisions become Needs review.</p>${[['start','Original cable · competitive start','₹55 cost · ₹1,000 cash · cap nine'],['higher','Higher earnings alternative','Original cable · earnings per order'],['cost','Cost rises to ₹90','Eight affordable new units · quote review'],['moq','MOQ nine at ₹90 cost','Show the procurement blocker'],['caseB','Case B · six owned cables','₹25 minimum per kept order'],['restock','Case B · buy ten more','Six owned + ten new; reserve included'],['private','Private acquisition cost','Clear cost; thresholds only'],['historical','Historical evidence only','Withhold a current price instruction']].map(([id,t,d])=>btn(`${t}<small>${d}</small>`,'preset','preset',`data-preset="${id}"`)).join('')}<hr>${btn('Reset all inputs and history','reset')}`,'demo');}
function loadPreset(id){const target=['caseB','restock'].includes(id)?'caseB':'cable';current=target;const version=c().version+1;history.filter(h=>h.case===current).forEach(h=>h.state='Needs review');states[target]=F.create(target);c().version=version;step=1;route='wizard';if(id==='start')step=0;if(id==='higher')c().objective='earnings';if(id==='cost'||id==='moq'){c().cost=90;c().quoteValid=false;if(id==='moq')c().moq=9;}if(id==='restock'){c().procure='plan';c().newUnits=10;c().cap=16;}if(id==='private'){c().private=true;c().cost=null;}if(id==='historical')c().mode='historical';close();render();}
function bundle(){const b=M.bundle(bundleQ);modal('Explore a useful bundle',`<div class="eyebrow">CASE B · CABLE + TEN CLIPS</div><p>Supplied complete-pack quote: enter ₹189 → buyer ₹213 → transfer ₹119.</p>${kv('Component acquisition · cable + clips',money(65))}${kv('Packaging',money(6))}${kv('Kept contribution',money(b?.kept))}<label class="field">Customer returns missing clips (%)<input id="bundle-q" type="number" min="0" max="100" value="${bundleQ??''}"></label><div id="bundle-results">${bundleResults()}</div><p class="mini">Six paid cables and forty paid clip packs cap initial bundles at six. Owned clips retain their economic cost. Full quote validity, comparability and buyer response still need checking.</p><p class="notice">Additional standalone clip sales and buyer response are needed to establish total incremental benefit. No automatic bundle approval.</p>`,'bundle');}
function bundleResults(){const b=M.bundle(bundleQ);return b?`${kv('Bundle expected / dispatch',money(b.expected))}${kv('Cable-only B expected / dispatch',money(b.cable))}${kv('Initial stock cap',b.cap+' bundles')}${kv('Cash for six owned bundles',money(b.cash))}<small>₹36 preparation + ₹180 reserve. Missing-clip sensitivity = ₹24.60 − ₹0.70 × missing share.</small>`:'<p class="notice">Enter a missing-clip share from 0% to 100%.</p>';}
function inspect(i){selectedHistory=i;const h=history[i];modal('Saved decision snapshot',`${status(h.state,h.state==='Saved test'?'good':'')}<p>${esc(h.name)} · ${new Date(h.time).toLocaleString()}</p>${kv('Objective',goals[h.inputs.objective][0])}${kv('Buyer / seller entry',money(h.selected?.buyer)+' / '+money(h.selected?.entry))}${kv('Expected / dispatch',money(h.selected?.expected))}${kv('Cash commitment',money(h.cash.total))}${kv('Input version',h.version)}<details><summary>Inspect all saved inputs</summary><pre class="snapshot">${esc(JSON.stringify(h.inputs,null,2))}</pre></details><p class="notice">Export and print include acquisition cost, cash limits, all saved inputs, calculated results and the local timestamp. These fields may be commercially private.</p><div class="actions">${btn('Export JSON','export','primary')}${btn('Print decision sheet','print')}</div>`,'snapshot');}
function save(hold){const r=e();if(!hold&&!r.selected)return;const h={case:current,name:c().name,time:new Date().toISOString(),version:c().version,inputs:structuredClone(c()),selected:hold?null:structuredClone(r.selected),cash:structuredClone(r.cash),state:hold?'Hold':'Saved test'};history.unshift(h);navigate('history');toast(`${hold?'Hold':'Test decision'} saved locally: ${h.name}${h.selected?' · buyer '+money(h.selected.buyer)+' · '+h.cash.quantity+' units · '+money(h.cash.total):''}. No listing changed.`);}
function reset(){modal('Reset demo?',`<p>This clears all local decision snapshots and restores both supplied fixtures.</p><div class="actions">${btn('Reset inputs and history','confirm-reset','primary')}${btn('Cancel','close')}</div>`,'reset');}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;const d=el.dataset;if(d.nav){navigate(d.nav);return;}const a=d.action;if(a==='close')return close();if(a==='review'){current=d.case;step=0;return navigate('wizard');}if(a==='orders'||a==='history')return navigate(a);if(a==='step'){step=+d.step;return render();}if(a==='next'){step=Math.min(2,step+1);render();window.scrollTo(0,0);return;}if(a==='edit'||a==='compare'){step=a==='edit'?0:1;return navigate('wizard');}if(a==='goal'){update('objective',d.goal);return render();}if(a==='choose'){if(!e().rows.find(r=>r.id===d.id)?.eligible)return;invalidate();c().preferred=d.id;return render();}if(a==='save'||a==='hold')return save(a==='hold');if(a==='demo')return demo();if(a==='preset')return loadPreset(d.preset);if(a==='reset')return reset();if(a==='confirm-reset'){states={cable:F.create(),caseB:F.create('caseB')};current='cable';history=[];futures=['Hold','Markdown','Bundle','Liquidate'].map(name=>({name,receipts:null,costs:null,terminal:null}));bundleQ=0;cohort='positive';signal='outcomes';step=0;close();navigate('products');toast('Demo reset. Original fixtures restored.');return;}if(a==='cohort'){cohort=d.cohort;signal='outcomes';return render();}if(a==='bundle')return bundle();if(a==='inspect')return inspect(+d.index);if(a==='delete'){history.splice(+d.index,1);render();toast('Local decision deleted.');return;}if(a==='export'){const blob=new Blob([JSON.stringify(history[selectedHistory],null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='PriceCompass-decision.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Decision sheet exported with the disclosed private inputs.');return;}if(a==='print'){document.querySelector('.print-only')?.remove();const div=document.createElement('section');div.className='print-only';const h=history[selectedHistory];div.innerHTML=`<h1>PriceCompass decision sheet</h1><p>Local demo snapshot · ${esc(h.name)} · ${new Date(h.time).toLocaleString()}</p><p>${esc(h.state)} · Input version ${h.version}</p><h2>${h.selected?'Test '+money(h.selected.buyer)+' buyer offer':'Hold for review'}</h2><p>You enter ${money(h.selected?.entry)} · Expected ${money(h.selected?.expected)} / dispatch · ${h.cash.quantity??'–'} units · Keep ${money(h.cash.total)} available</p><h3>Seller inputs at approval</h3><div class="print-grid">${[['Objective',goals[h.inputs.objective][0]],['Acquisition cost',money(h.inputs.cost)],['Outside cost',money(h.inputs.outside)],['Available cash',money(h.inputs.cash)],['Paid owned stock',h.inputs.owned],['Total dispatch cap',h.inputs.cap],['Reorder MOQ',h.inputs.moq],['Stock plan',h.inputs.procure],['New units requested',h.inputs.newUnits],['Minimum earnings',money(h.inputs.minimum)+' / '+h.inputs.unit],['Retained reserve / unit',money(h.inputs.reserve)],['Upfront cash',money(h.inputs.upfront)],['Extra return charge',money(h.inputs.returnFee)],['Outcome mix',h.inputs.kept+'% kept / '+h.inputs.rto+'% RTO / '+h.inputs.returned+'% returned'],['Return damage share',h.inputs.damage+'%'],['Weight / route',h.inputs.weight+' g / '+h.inputs.route],['Quote assumption',h.inputs.quoteValid?'Supplied demo quote valid':'Refresh needed'],['Evidence mode',h.inputs.mode]].map(([k,v])=>kv(k,esc(v))).join('')}</div><h3>Review before the next commitment</h3><p>Review immediately when cost, weight, route, fees or quote validity changes. Use mature outcomes for performance-led price tests. Recovered stock is an asset, not cash; retained reserve is not an expense.</p><p>Supplied model inputs and calculated outputs. No listing change, procurement or dispatch occurred. Private cost fields are included at your explicit request. JSON export contains the complete machine-readable snapshot.</p>`;document.body.append(div);window.print();return;}if(a==='origins')return modal('Case details & origins',`<h3>Historical cable anchors</h3><p>The supplied cable audit / manual records buyer ₹189 → transfer ₹96 and buyer ₹210 → transfer ₹116. Historical observations alone do not establish current quotes or a first-price instruction.</p><h3>Supplied model cases</h3><p>Exact seller entries, peers, costs, cash policies, Case B, the bundle and three separate lifecycle cohorts are specified demo fixtures in 01_BUILD_PROMPT.md and the supplied Round 2 deck. They are not observed seller outcomes.</p><h3>Calculation lineage</h3><p>Outcome arithmetic reuses the intact-return accounting in the prior prototype, with corrected objective-aware ranking, owned-stock cash and independent eligibility gates. Fees already embedded in transfers are not deducted twice.</p><h3>Visual context</h3><p>Original supplier-reference screenshots inform the compact navigation and product tables. This is a Meesho-inspired independent prototype, not a verified copy of the current live interface.</p><label class="field">Evidence mode<select id="mode"><option value="demo" ${c().mode==='demo'?'selected':''}>Supplied demo assumptions</option><option value="historical" ${c().mode==='historical'?'selected':''}>Historical evidence only</option></select></label>`,'origins');if(a==='help')return modal('Help & privacy',`<h3>Start with a product</h3><p>Choose your goal and enter costs, compare the quotes, then save a limited test or hold. Review settled outcomes before the next batch.</p><h3>Local by default</h3><p>No analytics, external requests, live account connection or background saving. Acquisition cost and decisions stay in memory. Reloading clears them. JSON export and print are explicit actions and disclose their private fields first.</p><h3>Private-cost mode</h3><p>Clears acquisition cost from the active model and withholds precise earnings and automatic approval. Earlier explicitly saved snapshots remain inspectable until deleted or reset.</p>`,'help');});
function numeric(v){return v.trim()===''?null:Number(v);}
function refreshInput(el){const k=el.dataset.key;if(!k)return;const textKeys=['unit','procure','route'];update(k,textKeys.includes(k)?el.value:numeric(el.value));if(route==='wizard'&&step===0&&el.tagName==='INPUT'){$('cash-live').innerHTML=cashSummary(e());$('input-alert').innerHTML=reviewNotice(e());if($('quote-valid'))$('quote-valid').checked=c().quoteValid;}else{const open=[...document.querySelectorAll('main details')].map(x=>x.open);const id=el.id;render();document.querySelectorAll('main details').forEach((x,i)=>x.open=open[i]);const next=$(id);next?.focus();}}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.key&&el.tagName==='INPUT')return refreshInput(el);if(el.id==='bundle-q'){bundleQ=numeric(el.value);$('bundle-results').innerHTML=bundleResults();}if(el.dataset.future!==undefined){futures[+el.dataset.future][el.dataset.part]=numeric(el.value);invalidate();const result=M.future(futures);result.forEach((r,i)=>$('future-'+i).textContent=money(r.net));$('future-notice').textContent=result.some(r=>r.net===null)?'Enter missing option inputs before comparing. This scenario does not establish buyer demand.':'Highest stated future cash: '+result.reduce((a,b)=>a.net>b.net?a:b).name+'. Validate receipts, timing and quotes before committing. This scenario does not establish buyer demand.';}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.key&&el.tagName==='SELECT')return refreshInput(el);if(el.id==='case-select'){current=el.value;step=0;return render();}if(el.id==='private'){c().private=el.checked;c().cost=null;invalidate();return render();}if(el.id==='quote-valid'){c().quoteValid=el.checked;invalidate();$('input-alert').innerHTML=reviewNotice(e());return;}if(el.id==='mode'){update('mode',el.value);close();render();return;}if(el.id==='signal'){signal=el.value;render();}});
$('dialog').addEventListener('cancel',()=>{dialogKind='';returnFocus?.focus();});
window.PCApp={getState:()=>({states,current,route,step,history}),evaluate:e};render();
</script></body></html>
